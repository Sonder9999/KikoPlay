name: Build KikoPlay Windows

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fullscreen-episode-switch
      - '*'
    tags:
      - '*'

env:
  QT_VERSION: "6.6.3"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        target: 'desktop'
        modules: 'qtpositioning qtwebchannel qtwebengine qtwebsockets'
        cache: true

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install jom
      run: choco install jom -y

    - name: Create empty secrets header
      shell: bash
      run: |
        cat > Common/secrets.h << 'EOF'
        #undef APP_ID_KIKO
        #undef APP_SECRET_KIKO
        #undef APP_ID_DANDAN
        #undef APP_SECRET_DANDAN

        #define APP_ID_KIKO ""
        #define APP_SECRET_KIKO ""
        #define APP_ID_DANDAN ""
        #define APP_SECRET_DANDAN ""
        EOF

    - name: Build
      shell: cmd
      run: |
        qmake KikoPlay.pro || exit /b 1
        jom -j4 release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KikoPlay-win64-dual-screenshot
        path: release/KikoPlay.exe
        if-no-files-found: error
