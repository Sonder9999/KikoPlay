name: Build KikoPlay Windows

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fullscreen-episode-switch

env:
  QT_VERSION: "6.6.3"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        target: 'desktop'
        modules: 'qtpositioning qtwebchannel qtwebengine qtwebsockets'
        cache: true

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install jom
      run: choco install jom -y

    # KSERVICE 在 Windows 上恒开，Common/network.h 会 include 此头文件。
    # 写空值即可通过编译（凭据由用户本地脚本/插件自行持有，不进仓库、不进 CI）。
    - name: Create empty secrets header
      shell: bash
      run: |
        cat > Common/secrets.h << 'EOF'
        #undef APP_ID_KIKO
        #undef APP_SECRET_KIKO
        #undef APP_ID_DANDAN
        #undef APP_SECRET_DANDAN

        #define APP_ID_KIKO ""
        #define APP_SECRET_KIKO ""
        #define APP_ID_DANDAN ""
        #define APP_SECRET_DANDAN ""
        EOF

    - name: Build
      shell: bash
      run: |
        set -e
        qmake KikoPlay.pro
        jom -j4 release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KikoPlay-win64-fix-fullscreen
        path: release/KikoPlay.exe
        if-no-files-found: error
